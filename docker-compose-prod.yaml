services:
  mongodb:
    image: mongo:8
    container_name: nammongodb-prod
    ports:
      - "27017:27017"
    volumes:
      - mongodb-prod-data:/data/db
      - mongodb-prod-config:/data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  product-api:
    image: ${DOCKERHUB_USERNAME}/product-api:latest
    container_name: product-api-prod
    pull_policy: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      MONGO_URI: mongodb://nammongodb-prod:27017/productdb
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongodb-prod-data:
  mongodb-prod-config: