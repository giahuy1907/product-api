name: Product API Deploy Local

on:
  workflow_run:
    workflows:
      - Product API CD
    types:
      - completed

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    runs-on: [self-hosted, windows, x64]

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Check Docker
        shell: pwsh
        run: |
          docker version
          docker compose version

      - name: Pull image from Docker Hub
        shell: pwsh
        run: |
          docker pull giahuy12/product-api:latest

      - name: Deploy production containers
        shell: pwsh
        run: |
          docker compose -f docker-compose-prod.yaml up -d --no-build --force-recreate product-api

      - name: Wait for Product API healthcheck
        shell: pwsh
        run: |
          $deadline = (Get-Date).AddSeconds(60)
          $status = ""

          do {
            $status = docker inspect -f "{{.State.Health.Status}}" product-api-prod 2>$null

            Write-Host "Product API health status: $status"

            if ($status -eq "healthy") {
              Write-Host "Product API is healthy"
              exit 0
            }

            Start-Sleep -Seconds 2
          } while ((Get-Date) -lt $deadline)

          Write-Host "Product API healthcheck failed"
          docker compose -f docker-compose-prod.yaml ps
          docker compose -f docker-compose-prod.yaml logs --tail=100 product-api
          exit 1

      - name: Verify API health endpoint
        shell: pwsh
        run: |
          $response = Invoke-RestMethod -Uri "http://localhost:3001/health"

          Write-Host "Status: $($response.status)"
          Write-Host "MongoDB: $($response.mongodb)"

          if ($response.status -ne "ok" -or $response.mongodb -ne "connected") {
            Write-Host "Health endpoint verification failed"
            exit 1
          }

          Write-Host "Health endpoint verification passed"

      - name: Verify production containers
        shell: pwsh
        run: |
          docker compose -f docker-compose-prod.yaml ps