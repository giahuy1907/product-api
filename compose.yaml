services:
  nammongodb:
    image: mongo:latest
    container_name: nammongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping')\""]
      interval: 5s
      timeout: 5s
      retries: 10

  product-api:
    build: .
    container_name: product-api
    ports:
      - "3000:3000"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      nammongodb:
        condition: service_healthy

volumes:
  mongodb-data:
